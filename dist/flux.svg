<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Flux mark Φ phi on a Tokyo Night tile. The 16-unit box is 88 px, 5.5 px per unit. -->
  <rect width="128" height="128" fill="#16161e"/>
  <rect x="0.5" y="0.5" width="127" height="127" fill="none" stroke="#292e42"/>
  <!-- The ring: 10 units at 3 units, with a 2-unit stroke. -->
  <path fill="#c0caf5" fill-rule="evenodd" d="M36.5 36.5h55v55h-55z M47.5 47.5v33h33v-33z"/>
  <!-- The bar: 2 by 14 units at 7 and 1 units, over the ring. -->
  <rect x="58.5" y="25.5" width="11" height="77" fill="#7aa2f7"/>
</svg>
