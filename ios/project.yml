name: Flux
options:
  bundleIdPrefix: org.omarchy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  FluxKit:
    path: ../macos
targets:
  Flux:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: FluxKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Flux finds and connects to your Omarchy computers on the local network.
        NSBonjourServices:
          - _kdeconnect._udp
        NSPhotoLibraryUsageDescription: Flux sends your new screenshots and photos to your computers when you turn that on in Settings.
        NSMicrophoneUsageDescription: Flux listens while you dictate, and the computer types the words.
        NSSpeechRecognitionUsageDescription: Flux changes your speech to text for the computer to type. The iPhone recognizes it on the device when it has the language.
        NSFaceIDUsageDescription: Flux checks that it is you before your iPhone types, replies, or shows the screen on a computer.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Flux
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  FluxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Flux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  Flux:
    build:
      targets:
        Flux: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxTests
        - package: FluxKit/FluxKitTests
