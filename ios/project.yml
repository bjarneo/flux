name: Flux
options:
  bundleIdPrefix: org.omarchy
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # The privacy manifest of each target, App/PrivacyInfo.xcprivacy and
  # ShareExtension/PrivacyInfo.xcprivacy, goes into the bundle of that target.
  fileTypes:
    xcprivacy:
      buildPhase: resources
settings:
  base:
    # The App Group of the share queue, for the app and the share extension.
    # A device build needs a group id that the developer's team owns.
    FLUX_APP_GROUP: group.org.omarchy.flux
packages:
  FluxKit:
    path: ../macos
targets:
  Flux:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    dependencies:
      - package: FluxKit
      - target: FluxShare
    entitlements:
      path: App/Flux.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FLUX_APP_GROUP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flux
        FluxAppGroup: $(FLUX_APP_GROUP)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: Flux finds and connects to your Omarchy computers on the local network.
        NSBonjourServices:
          - _flux._udp
        NSPhotoLibraryUsageDescription: Flux sends your new screenshots and photos to your computers when you turn that on in Settings.
        NSMicrophoneUsageDescription: Flux listens while you dictate, and while you use this iPhone as a microphone for a computer.
        NSCameraUsageDescription: Flux uses the camera to scan text, codes, and pages, to take photos and signatures, and to stream as a webcam to a computer.
        NSSpeechRecognitionUsageDescription: Flux changes your speech to text for the computer to type. The iPhone recognizes it on the device when it has the language.
        NSFaceIDUsageDescription: Flux checks that it is you before your iPhone types or replies on a computer, shows the screen of a computer, or approves sudo.
        UIFileSharingEnabled: true
        # The microphone stream keeps running while Flux is in the background
        # or the iPhone is locked, like a call or a voice recorder.
        UIBackgroundModes:
          - audio
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: Flux
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  FluxShare:
    type: app-extension
    platform: iOS
    sources:
      - ShareExtension
      - Shared
    entitlements:
      path: ShareExtension/FluxShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(FLUX_APP_GROUP)
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Flux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FluxAppGroup: $(FLUX_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 20
              NSExtensionActivationSupportsImageWithMaxCount: 20
              NSExtensionActivationSupportsMovieWithMaxCount: 10
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_NAME: FluxShare
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux.ios.share
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
  FluxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: Flux
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
schemes:
  Flux:
    build:
      targets:
        Flux: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxTests
        - package: FluxKit/FluxKitTests
