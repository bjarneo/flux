# Flux Xcode project (D7). Generated with `xcodegen generate` (xcodegen
# is installed on the dev Mac; CI keeps using SPM via `make ios`).
#
# Free-tier debug shape: app target + one framework per SPM module (so the
# `import FluxCore` etc. module boundaries hold) + unit-test bundles.
# Excluded until a paid team exists (D5): multicast entitlement (uses
# Flux-Debug.entitlements instead of Flux.entitlements), App Groups, and
# the Share/Broadcast/Notification extensions. FluxTestPeer stays an
# SPM-only macOS CLI (not in this project).
name: Flux
packages:
  # D1 browse: SSH client + SFTP (Citadel wraps NIOSSH; MIT). Exact pins
  # match ios/Package.swift so Xcode and SPM resolve identically.
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.9.2
  swift-nio:
    url: https://github.com/apple/swift-nio.git
    exactVersion: 2.103.0
options:
  bundleIdPrefix: org.omarchy.flux
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
targets:
  FluxProto:
    type: framework
    platform: iOS
    sources: [Sources/FluxProto]
  FluxNet:
    type: framework
    platform: iOS
    sources: [Sources/FluxNet]
    dependencies:
      - target: FluxProto

  FluxApprove:
    type: framework
    platform: iOS
    sources: [Sources/FluxApprove]
    dependencies:
      - target: FluxProto

  FluxCore:
    type: framework
    platform: iOS
    sources: [Sources/FluxCore]
    dependencies:
      - target: FluxProto
      - target: FluxNet
      - target: FluxApprove
      - package: Citadel
        product: Citadel
      - package: swift-nio
        product: NIO

  FluxFeatures:
    type: framework
    platform: iOS
    sources: [Sources/FluxFeatures]
    dependencies:
      - target: FluxProto
      - target: FluxCore
      - target: FluxApprove

  FluxCamera:
    type: framework
    platform: iOS
    sources: [Sources/FluxCamera]
    dependencies:
      - target: FluxProto

  FluxStream:
    type: framework
    platform: iOS
    sources: [Sources/FluxStream]
    dependencies:
      - target: FluxProto
      - target: FluxCamera

  FluxUI:
    type: framework
    platform: iOS
    sources: [Sources/FluxUI]
    dependencies:
      - target: FluxProto
      - target: FluxCore
      - target: FluxApprove
      - target: FluxCamera
      - target: FluxStream

  Flux:
    type: application
    platform: iOS
    sources:
      - path: App/FluxApp.swift
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - target: FluxProto
      - target: FluxNet
      - target: FluxCore
      - target: FluxFeatures
      - target: FluxApprove
      - target: FluxCamera
      - target: FluxStream
      - target: FluxUI

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux
        INFOPLIST_FILE: App/Info.plist
        # The app uses its own plist verbatim: generation ON drops usage
        # descriptions (first-device finding 2026-09-27 — no Local Network
        # prompt possible without NSLocalNetworkUsageDescription).
        # Frameworks keep the generated plist (base settings).
        GENERATE_INFOPLIST_FILE: NO
        # Seeds for $(MARKETING_VERSION)/$(CURRENT_PROJECT_VERSION) in the
        # plist (TestFlight build-number rule: bump the latter per upload).
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        CODE_SIGN_ENTITLEMENTS: App/Flux-Debug.entitlements
        CODE_SIGN_STYLE: Automatic
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        SWIFT_VERSION: 6.0
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
  FluxProtoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/FluxProtoTests]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    dependencies:
      - target: FluxProto

  FluxNetTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxNetTests]
    dependencies:
      - target: FluxNet
      - target: FluxProto
      - target: FluxCore

  FluxCoreTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxCoreTests]
    dependencies:
      - target: FluxCore
      - target: FluxProto
      - target: FluxApprove

  FluxFeaturesTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxFeaturesTests]
    dependencies:
      - target: FluxFeatures
      - target: FluxProto
      - target: FluxApprove

  FluxApproveTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxApproveTests]
    dependencies:
      - target: FluxApprove
      - target: FluxProto

  FluxCameraTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxCameraTests]
    dependencies:
      - target: FluxCamera
      - target: FluxProto

  FluxStreamTests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxStreamTests]
    dependencies:
      - target: FluxStream
      - target: FluxProto
      - target: FluxCamera

  FluxUITests:
    type: bundle.unit-test
    platform: iOS
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Tests/FluxTests.entitlements
    sources: [Tests/FluxUITests]
    dependencies:
      - target: FluxUI

schemes:
  Flux:
    build:
      targets:
        Flux: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FluxProtoTests
        - FluxNetTests
        - FluxCoreTests
        - FluxFeaturesTests
        - FluxApproveTests
        - FluxCameraTests
        - FluxStreamTests
        - FluxUITests
settings:
  base:
    SWIFT_VERSION: 6.0
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
    GENERATE_INFOPLIST_FILE: YES
