name: Flux
options:
  bundleIdPrefix: org.omarchy
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  FluxKit:
    path: .
targets:
  Flux:
    type: application
    platform: macOS
    sources:
      - App
    dependencies:
      - package: FluxKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Flux
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        NSLocalNetworkUsageDescription: Flux finds and connects to your Omarchy computers on the local network.
        NSBonjourServices:
          - _flux._udp
        NSCameraUseContinuityCameraDeviceType: true
        NSCameraUsageDescription: Flux streams the camera to your computer and captures photos and scans.
        NSMicrophoneUsageDescription: Flux streams the microphone to your computer and turns your speech into text in the text fields of the app.
        NSSpeechRecognitionUsageDescription: Flux turns your speech into text in the text fields of the app, for example your replies to the coding agents and the text that you type on your computers.
        NSPhotoLibraryUsageDescription: Flux sends each new photo in your library to your computers when you turn on Send new photos.
        NSDownloadsFolderUsageDescription: Flux saves the files that your computers send to this Mac.
        CFBundleDocumentTypes:
          - CFBundleTypeName: File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.item
        NSServices:
          - NSMenuItem:
              default: Send to Flux
            NSMessage: sendFilesToFlux
            NSPortName: Flux
            NSRequiredContext: {}
            NSSendFileTypes:
              - public.item
          - NSMenuItem:
              default: Send to Flux
            NSMessage: sendTextToFlux
            NSPortName: Flux
            NSRequiredContext: {}
            NSSendTypes:
              - public.utf8-plain-text
    settings:
      base:
        PRODUCT_NAME: Flux
        PRODUCT_BUNDLE_IDENTIFIER: org.omarchy.flux.mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
