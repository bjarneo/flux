<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    touch-action: none; }
  #stage { position: absolute; left: 0; top: 0; }
  #screen { margin: 0; }
</style>
</head>
<body>
<div id="stage"><div id="screen"></div></div>
<script src="xterm.js"></script>
<script>
(function () {
  // The terminal shows the frames of one herdr pane. Flux feeds ANSI
  // bytes and fixes the grid size; no input goes back to the app here,
  // so this page never answers terminal queries by itself.
  var term = new Terminal({
    cols: 80,
    rows: 24,
    scrollback: 0,
    disableStdin: true,
    convertEol: false,
    cursorBlink: false,
    fontFamily: "monospace",
    fontSize: 13
  });
  term.open(document.getElementById("screen"));
  // Herdr renders absolute cell runs and expects host autowrap off.
  term.write("\u001b[?7l");

  // The grid keeps the size of the pane on the computer, so it can be
  // wider and taller than the view. The page shrinks the font until the
  // whole grid fits, and the app then zooms and pans over it. Flux
  // passes the real view size in CSS pixels, because the layout viewport
  // of a WebView is not its visible area.
  var availW = 0;
  var availH = 0;
  var fitFont = 13;
  // The phone terminal asks the computer for about this many columns:
  // enough that a full-screen program such as opencode drops its
  // sidebars, while the drawing still fills the phone at a readable
  // font. The font is derived from it, so a wider phone shows the same
  // content in a larger font.
  var phoneCols = 80;
  var panX = 0;
  var panY = 0;

  // The real cell of the drawn grid, and where it starts. The app maps
  // its touches to cells with these numbers, so they come from the
  // rendering itself and not from an estimate of the font.
  function measure() {
    var r = document.querySelector(".xterm-screen").getBoundingClientRect();
    return { w: r.width / term.cols, h: r.height / term.rows, left: r.left, top: r.top };
  }

  function report() {
    if (!(window.FluxBridge && window.FluxBridge.geometry)) return;
    var m = measure();
    if (m.w <= 0 || m.h <= 0) return;
    window.FluxBridge.geometry(m.w, m.h, m.left, m.top, term.cols, term.rows, term.options.fontSize);
  }

  // The grid is centered while it fits the view and pans within the
  // view when it does not, so it can never leave the screen.
  function clampPan(p, avail, grid) {
    if (grid <= avail) return (avail - grid) / 2;
    return Math.min(0, Math.max(avail - grid, p));
  }

  function place() {
    var m = measure();
    panX = clampPan(panX, availW, m.w * term.cols);
    panY = clampPan(panY, availH, m.h * term.rows);
    var stage = document.getElementById("stage");
    stage.style.left = panX + "px";
    stage.style.top = panY + "px";
  }

  function settled(fn) {
    // The grid dimensions land with the next render after a font change.
    requestAnimationFrame(function () { fn(); report(); });
  }

  function fit(w, h) {
    availW = w || availW;
    availH = h || availH;
    // Monospace fallback per font pixel, when the probe cannot measure.
    var cellW = 0.62;
    var cellH = 1.25;
    var probe = document.createElement("span");
    probe.style.position = "absolute";
    probe.style.left = "-9999px";
    probe.style.top = "0";
    probe.style.whiteSpace = "pre";
    probe.style.fontFamily = term.options.fontFamily;
    probe.style.fontSize = "100px";
    probe.textContent = "MMMMMMMMMM";
    document.body.appendChild(probe);
    var rect = probe.getBoundingClientRect();
    probe.remove();
    var w2 = rect.width / 1000;
    var h2 = rect.height / 100;
    if (w2 > 0.4 && w2 < 0.9) cellW = w2;
    if (h2 > 0.9 && h2 < 1.8) cellH = h2;
    var size = Math.min(
      availW / (cellW * term.cols),
      availH / (cellH * term.rows)
    );
    // The font grows to fill the view too: a phone-sized grid must not
    // draw small in a corner of the screen.
    fitFont = Math.max(3, Math.min(24, Math.floor(size)));
    term.options.fontSize = fitFont;
    // The grid that the phone asks the computer for: about phoneCols
    // columns at a readable font, filling the view. The font is clamped
    // so it stays readable on any screen.
    if (availW > 0 && availH > 0 && window.FluxBridge && window.FluxBridge.grid) {
      var phoneFont = Math.max(8, Math.min(18, availW / (cellW * phoneCols)));
      var cols = Math.max(20, Math.min(500, Math.floor(availW / (cellW * phoneFont))));
      var rows = Math.max(6, Math.min(500, Math.floor(availH / (cellH * phoneFont))));
      window.FluxBridge.grid(cols, rows);
    }
    panX = 0;
    panY = 0;
    window.scrollTo(0, 0);
    settled(place);
  }

  window.FluxTerminal = {
    reset: function (cols, rows, w, h) {
      term.reset();
      term.resize(cols, rows);
      term.write("\u001b[?7l");
      fit(w, h);
    },
    write: function (base64) {
      var raw = atob(base64);
      var bytes = new Uint8Array(raw.length);
      for (var i = 0; i < raw.length; i++) bytes[i] = raw.charCodeAt(i);
      term.write(bytes);
    },
    theme: function (json) {
      var t = JSON.parse(json);
      term.options.theme = t;
      // The page shows the theme behind the grid too, for example while
      // the grid pans. An explicit frame color still wins inside cells.
      document.body.style.background = t.background || "transparent";
      document.getElementById("stage").style.background = t.background || "transparent";
    },
    // Zoom keeps the cell under the focal point where it is, so the
    // content follows the fingers of a pinch. The font never goes below
    // the fit: the whole grid stays reachable.
    zoom: function (font, fx, fy) {
      var before = measure();
      var cx = (fx - before.left) / before.w;
      var cy = (fy - before.top) / before.h;
      term.options.fontSize = Math.max(fitFont, Math.min(24, Math.round(font)));
      settled(function () {
        var after = measure();
        panX = fx - cx * after.w;
        panY = fy - cy * after.h;
        place();
      });
    },
    pan: function (dx, dy) {
      panX += dx;
      panY += dy;
      place();
      report();
    }
  };

  // Android owns the complete native touch stream, including batched
  // positions. Do not forward DOM touches as a second gesture stream.

  fit();
  if (window.FluxBridge && window.FluxBridge.ready) {
    window.FluxBridge.ready(term.cols, term.rows);
  }
})();
</script>
</body>
</html>
