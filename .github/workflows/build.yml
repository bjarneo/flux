name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag to package from its source archive
        type: string
        default: ''
      apple:
        description: Also test the Mac and iOS apps, which releases do not ship
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed go cmake ninja git python \
            qt6-base qt6-declarative qt6-svg qt6-wayland ttf-jetbrains-mono-nerd \
            wl-clipboard pipewire avahi xdg-utils
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release source
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: python scripts/prepare-aur.py --tag "$TAG" --repo "$REPO"
      - name: Test release package generator
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Build and test the complete package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          package_dir="$GITHUB_WORKSPACE/dist/arch"
          if [[ -n "$TAG" ]]; then package_dir="$GITHUB_WORKSPACE/dist/aur"; fi
          runuser -u builder -- bash -c 'cd "$1" && makepkg --noconfirm && makepkg --printsrcinfo > .SRCINFO' bash "$package_dir"
      - name: Upload Arch package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: |
            dist/arch/*.pkg.tar.zst
            dist/aur/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
      - name: Upload AUR recipe
        if: inputs.tag != ''
        uses: actions/upload-artifact@v4
        with:
          name: aur-package
          path: |
            dist/aur/PKGBUILD
            dist/aur/.SRCINFO
            dist/aur/omarchy-flux.install
          include-hidden-files: true
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The default packages of the action include "tools", which the
      # current cmdline-tools no longer have.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/

  # The Mac app and FluxKit. The iOS app uses iOS 26 APIs behind
  # availability checks, so both jobs need the Xcode 26 of macos-26.
  # Releases ship neither app, so release.yml turns these jobs off.
  macos:
    if: inputs.apple != false
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      # Xcode 26 by path, so that a new default Xcode on the runner does
      # not change the build.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then echo "This runner has no Xcode 26" >&2; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test FluxKit and build the Mac app
        run: make test-macos macos

  ios:
    if: inputs.apple != false
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      # Xcode 26 by path, so that a new default Xcode on the runner does
      # not change the build.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then echo "This runner has no Xcode 26" >&2; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      # test-ios builds the app and runs the app tests and the FluxKit
      # tests in the first available iPhone simulator.
      - name: Build the iOS app and run the tests in the simulator
        run: make test-ios
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: ios/build/Logs/Test/
          retention-days: 14
