name: Build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Stable release tag to package from its source archive
        type: string
        default: ''
      ios:
        description: Also test the iOS app, which releases do not ship
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  arch:
    runs-on: ubuntu-latest
    # The image by digest, so that a changed tag on Docker Hub does not
    # change the build. docs/releasing.md tells how to update it.
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    defaults:
      run:
        shell: bash
    steps:
      # The keyring comes first, because the pinned image can be older
      # than the keys of the current packages.
      - name: Install build dependencies
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed go cmake ninja git python \
            qt6-base qt6-declarative qt6-svg qt6-wayland ttf-jetbrains-mono-nerd \
            wl-clipboard pipewire avahi xdg-utils
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare release source
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: python scripts/prepare-aur.py --tag "$TAG" --repo "$REPO"
      - name: Test release package generator
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Add the build user
        run: |
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
      # CI runs go vet, gofmt, and the tests with the race detector. The
      # check() of the package runs only the tests, so that a newer Go on
      # an AUR computer does not stop the build.
      - name: Vet and test the Go code
        run: runuser -u builder -- make -C "$GITHUB_WORKSPACE" vet test
      - name: Build the complete package
        env:
          TAG: ${{ inputs.tag }}
        run: |
          package_dir="$GITHUB_WORKSPACE/dist/arch"
          if [[ -n "$TAG" ]]; then package_dir="$GITHUB_WORKSPACE/dist/aur"; fi
          # The inner shell expands $1.
          # shellcheck disable=SC2016
          runuser -u builder -- bash -c 'cd "$1" && makepkg --noconfirm --nocheck && makepkg --printsrcinfo > .SRCINFO' bash "$package_dir"
      - name: Upload Arch package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: arch-package
          path: |
            dist/arch/*.pkg.tar.zst
            dist/aur/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 14
      - name: Upload AUR recipe
        if: inputs.tag != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur-package
          path: |
            dist/aur/PKGBUILD
            dist/aur/.SRCINFO
            dist/aur/omarchy-flux.install
          include-hidden-files: true
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      # The default packages of the action include "tools", which the
      # current cmdline-tools no longer have.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Test and build APKs
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-reports
          path: android/app/build/reports/

  # macOS runners are slow and use GitHub minutes at a high rate, so pull
  # requests skip this job. Pushes to master and releases run it. A release
  # calls this workflow, so its event is the push of the tag.
  macos:
    if: github.event_name != 'pull_request'
    # The pinned Swift packages need Swift 6.2, which comes with Xcode 26.
    runs-on: macos-26
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # The tags give the app version.
          fetch-depth: 0
          persist-credentials: false
      # A fixed XcodeGen release with a known checksum. The same version is
      # in release.yml.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: '2.46.0'
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test FluxKit
        run: swift test
      # The generic destination builds a universal app for Apple silicon and Intel.
      # The app version is the last release tag without v.
      # The copy of Package.resolved and -onlyUsePackageVersionsFromResolvedFile
      # give the app the package versions that swift test tested. A pin that
      # does not fit Package.swift stops the build.
      - name: Build the app
        run: |
          version=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null | sed 's/^v//')
          xcodegen generate --quiet
          mkdir -p Flux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved Flux.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          xcodebuild -project Flux.xcodeproj -scheme Flux -configuration Release \
            -derivedDataPath build -destination 'generic/platform=macOS' -quiet \
            -onlyUsePackageVersionsFromResolvedFile \
            MARKETING_VERSION="${version:-0.1.0}" build
      # ditto keeps the executable bits and symbolic links that upload-artifact drops.
      - name: Verify and package the app
        run: |
          app=build/Build/Products/Release/Flux.app
          codesign --verify --deep --strict "$app"
          # The hardened runtime keeps injected libraries out of the app.
          codesign -dv "$app" 2>&1 | grep 'flags=.*runtime'
          lipo -info "$app/Contents/MacOS/Flux"
          ditto -c -k --keepParent "$app" flux-macos.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-app
          path: macos/flux-macos.zip
          if-no-files-found: error
          retention-days: 14

  # The iOS app. Pull requests skip it, like the macos job. Releases build
  # the app in the ipa job of release.yml, so release.yml turns this job off.
  # A push has no inputs, and GitHub compares null and false as equal, so
  # the check compares the JSON text.
  ios:
    if: github.event_name != 'pull_request' && toJSON(inputs.ios) != 'false'
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          # The tags give the app version.
          fetch-depth: 0
          persist-credentials: false
      # Xcode 26 by path, so that a new default Xcode on the runner does
      # not change the build.
      - name: Select Xcode 26
        run: |
          # The Xcode names have no spaces.
          # shellcheck disable=SC2012
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then echo "This runner has no Xcode 26" >&2; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # A fixed XcodeGen release with a known checksum. The same version is
      # in release.yml.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: '2.46.0'
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      # test-ios builds the app and runs the app tests and the FluxKit
      # tests in the first available iPhone simulator.
      - name: Build the iOS app and run the tests in the simulator
        run: make test-ios
      # The Release build for iPhones shows the errors that only the
      # optimized build has, as the App Store build would. It needs no signing.
      - name: Build the iOS app in Release for iPhones
        run: make ios-release
      # iOS stops the app at the first use of a permission without its text.
      # App Store Connect needs the privacy manifest of each bundle.
      - name: Check the permission texts and the privacy manifests
        run: |
          app=ios/build/Build/Products/Release-iphoneos/Flux.app
          plist="$app/Info.plist"
          for key in NSLocalNetworkUsageDescription NSPhotoLibraryUsageDescription NSMicrophoneUsageDescription \
            NSCameraUsageDescription NSSpeechRecognitionUsageDescription NSFaceIDUsageDescription; do
            if ! text=$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist") || [[ -z "${text//[[:space:]]/}" ]]; then
              echo "$plist has no text for $key" >&2
              exit 1
            fi
          done
          if ! services=$(/usr/libexec/PlistBuddy -c 'Print :NSBonjourServices' "$plist") || [[ "$services" != *_flux._udp* ]]; then
            echo "NSBonjourServices in $plist does not list _flux._udp" >&2
            exit 1
          fi
          for manifest in "$app/PrivacyInfo.xcprivacy" "$app/PlugIns/FluxShare.appex/PrivacyInfo.xcprivacy"; do
            if [[ ! -f "$manifest" ]]; then echo "$manifest is missing" >&2; exit 1; fi
            plutil -lint "$manifest"
          done
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-test-results
          path: ios/build/Logs/Test/
          retention-days: 14
