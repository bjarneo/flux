name: Windows

# Pull requests run no build, to save GitHub minutes. Pushes to master
# that change the Windows client, and manual runs, run it.
on:
  push:
    branches: [master]
    paths:
      - 'windows/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Restore locked dependencies
        run: |
          dotnet restore windows/FluxKit.Tests --locked-mode
          dotnet restore windows/Flux.UiTests --locked-mode
      # The fluxd tests skip here. The fluxd job runs them on Linux.
      - name: FluxKit tests
        run: dotnet test windows/FluxKit.Tests -c Release --no-restore
      - name: Flux UI checks
        run: dotnet run --project windows/Flux.UiTests -c Release --no-restore
      - name: Build the self-contained Windows app
        run: dotnet publish windows/Flux -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o windows/artifacts/win-x64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Flux-win-x64
          path: windows/artifacts/win-x64/Flux.exe
          if-no-files-found: error

  # FluxKit against a headless fluxd from the same commit.
  fluxd:
    runs-on: ubuntu-latest
    # The image of the arch job in build.yml, by digest.
    container: archlinux:base-devel@sha256:51dd3d24f7fba779e7c471caeee7804c50e8c134ad948e19685a1c83a42facc3
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Go and .NET
        run: |
          pacman -Sy --noconfirm --needed archlinux-keyring
          pacman -Su --noconfirm --needed go dotnet-sdk
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fluxd and flux-cli
        run: |
          mkdir -p windows/artifacts/e2e
          CGO_ENABLED=0 go build -trimpath -o windows/artifacts/e2e/fluxd ./cmd/fluxd
          CGO_ENABLED=0 go build -trimpath -o windows/artifacts/e2e/flux-cli ./cmd/flux
      - name: FluxKit tests against fluxd
        env:
          FLUX_E2E_BIN: ${{ github.workspace }}/windows/artifacts/e2e
        run: |
          dotnet restore windows/FluxKit.Tests --locked-mode
          dotnet test windows/FluxKit.Tests -c Release --no-restore
