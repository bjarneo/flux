name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild, such as v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Validate stable tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable tag such as v0.1.0.'
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          persist-credentials: false

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ios: false

  apk:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # The default packages of the action include "tools", which the
      # current cmdline-tools no longer have.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore release key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::$key is required for signed releases."
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/flux-release.jks"
      - name: Build signed release
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/flux-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          FLUX_VERSION: ${{ needs.version.outputs.name }}
          FLUX_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --stacktrace
      - name: Verify and stage APK
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" > "$RUNNER_TEMP/apk-certificate.txt"
          if grep -qi 'CN=Android Debug' "$RUNNER_TEMP/apk-certificate.txt"; then
            echo '::error::The release APK uses a debug key.'
            exit 1
          fi
          mkdir -p release
          cp "$apk" "release/flux-android-$VERSION.apk"
          cp "$RUNNER_TEMP/apk-certificate.txt" release/android-certificate.txt
      - name: Remove release key
        if: always()
        run: rm -f "$RUNNER_TEMP/flux-release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/release/
          if-no-files-found: error

  # The iOS app without signing, for sideload tools that sign it again with
  # the Apple ID of the user. The build job does not build it for a release.
  ipa:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # The full history gives the tag that sets the app version.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Xcode 26 by path, so that a new default Xcode on the runner does
      # not change the build.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then echo "This runner has no Xcode 26" >&2; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build the iOS app in Release for iPhones
        run: make ios-release
      - name: Verify and package the app
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          app=ios/build/Build/Products/Release-iphoneos/Flux.app
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          if [[ "$version" != "$VERSION" ]]; then
            echo "::error::The iOS app has version $version, not $VERSION."
            exit 1
          fi
          mkdir -p release/Payload
          cp -R "$app" release/Payload/
          (cd release && zip -qry "flux-ios-$VERSION.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: release/
          if-no-files-found: error

  publish:
    needs: [version, build, apk, ipa]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The full history gives the commits since the previous tag for the release notes.
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: arch-package
          path: artifacts/arch
      - uses: actions/download-artifact@v4
        with:
          name: aur-package
          path: artifacts/aur
      - uses: actions/download-artifact@v4
        with:
          name: android-release
          path: artifacts/android
      - uses: actions/download-artifact@v4
        with:
          name: macos-app
          path: artifacts/macos
      - uses: actions/download-artifact@v4
        with:
          name: ios-release
          path: artifacts/ios
      - name: Prepare release files
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          mkdir release
          find artifacts/arch -name '*.pkg.tar.zst' -exec cp {} release/ \;
          cp artifacts/android/* release/
          cp artifacts/macos/flux-macos.zip "release/flux-macos-$VERSION.zip"
          cp "artifacts/ios/flux-ios-$VERSION.ipa" release/
          tar -czf "release/omarchy-flux-$VERSION-aur.tar.gz" -C artifacts/aur PKGBUILD .SRCINFO omarchy-flux.install
          cd release
          sha256sum -- *.pkg.tar.zst *.apk *.zip *.ipa *-aur.tar.gz android-certificate.txt > SHA256SUMS
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "## What's Changed"
            echo
            git log "$range" --format='%H%x09%an%x09%s' | while IFS=$'\t' read -r hash author title; do
              login=$(gh api "repos/$REPO/commits/$hash" --jq '.author.login // empty' 2>/dev/null || true)
              by=$author
              if [ -n "$login" ]; then by="$author ([@$login](https://github.com/$login))"; fi
              echo "- $title by $by ([\`${hash:0:7}\`](https://github.com/$REPO/commit/$hash))"
            done
            echo
            echo '## Checksums (SHA256)'
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$REPO/compare/$prev...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --draft --title "Flux $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false

  aur:
    needs: [version, publish]
    if: vars.AUR_PUBLISH == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
