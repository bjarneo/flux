name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable tag to rebuild, such as v0.1.0
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Validate stable tag
        id: version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::Use a stable tag such as v0.1.0.'
            exit 1
          fi
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
          if (( major > 20 || minor > 999 || patch > 999 )); then
            echo '::error::The Android version code allows MAJOR up to 20, and MINOR and PATCH up to 999.'
            exit 1
          fi
          # The Android version code comes from the version, so a rebuild of
          # an earlier tag never gets a higher code than a later release.
          # The last 2 digits stay free for a rebuild counter.
          {
            echo "code=$(( (major * 1000000 + minor * 1000 + patch) * 100 ))"
            echo "tag=$TAG"
            echo "name=${TAG#v}"
          } >> "$GITHUB_OUTPUT"
      # The full history gives origin/master for the next step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ steps.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check that the tag is on master
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git merge-base --is-ancestor "refs/tags/$TAG" origin/master; then
            echo "::error::$TAG is not on master. Release only commits from master."
            exit 1
          fi

  build:
    needs: version
    uses: ./.github/workflows/build.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      ios: false

  # The release APK without a signature. This job has no secrets, so the
  # Gradle build, its plugins, and the actions never see the release key.
  apk:
    needs: version
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.apk.outputs.sha256 }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      # The default packages of the action include "tools", which the
      # current cmdline-tools no longer have.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0
      # A release does not use the Gradle cache of other runs.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true
      - name: Build the release APK without a signature
        env:
          FLUX_VERSION: ${{ needs.version.outputs.name }}
          FLUX_VERSION_CODE: ${{ needs.version.outputs.code }}
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Stage the APK
        id: apk
        run: |
          mkdir -p unsigned
          cp app/build/outputs/apk/release/app-release-unsigned.apk unsigned/
          echo "sha256=$(sha256sum unsigned/app-release-unsigned.apk | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-unsigned
          path: android/unsigned/
          if-no-files-found: error

  # Signs the APK with the release key. The job runs no Gradle and no
  # third-party action. Only zipalign and apksigner from the Android SDK of
  # the runner see the key.
  apk-sign:
    needs: [version, apk]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      BUILD_TOOLS: '36.0.0'
      # The SHA-256 digest of the Flux release certificate. Android installs
      # an update only with the certificate of the installed app. Change the
      # value only for a planned key rotation.
      CERT_SHA256: a9af3fb3886f2c7cf4e2c9d93824aed23314d4e4fb36a364373064aa11700884
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-unsigned
          path: unsigned
      - name: Sign the APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          UNSIGNED_SHA256: ${{ needs.apk.outputs.sha256 }}
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          for key in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!key}" ]]; then
              echo "::error::$key is required for signed releases."
              exit 1
            fi
          done
          # Sign only the APK that the apk job built.
          echo "$UNSIGNED_SHA256  unsigned/app-release-unsigned.apk" | sha256sum --check --strict -
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          if [[ ! -x "$tools/apksigner" ]]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$BUILD_TOOLS" > /dev/null
          fi
          keystore="$RUNNER_TEMP/flux-release.jks"
          trap 'rm -f "$keystore"' EXIT
          (umask 077 && printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore")
          "$tools/zipalign" -f -P 16 4 unsigned/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          mkdir -p release
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false \
            --out "release/flux-android-$VERSION.apk" "$RUNNER_TEMP/aligned.apk"
      # Phones with 16 KB memory pages need the native libraries of the APK
      # on 16 KB boundaries.
      - name: Verify the alignment, the signature, and the certificate
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign" -c -P 16 4 "release/flux-android-$VERSION.apk"
          "$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "release/flux-android-$VERSION.apk" > release/android-certificate.txt
          cat release/android-certificate.txt
          digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' release/android-certificate.txt)
          if [[ "$digest" != "$CERT_SHA256" ]] || grep -q '^Signer #2' release/android-certificate.txt; then
            echo "::error::The APK has the certificate ${digest:-none}, not the Flux release certificate $CERT_SHA256."
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release
          path: release/
          if-no-files-found: error

  # The iOS app without signing, for sideload tools that sign it again with
  # the Apple ID of the user. The build job does not build it for a release.
  ipa:
    needs: version
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # The full history gives the tag that sets the app version.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      # Xcode 26 by path, so that a new default Xcode on the runner does
      # not change the build.
      - name: Select Xcode 26
        run: |
          # The Xcode names have no spaces.
          # shellcheck disable=SC2012
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [[ -z "$xcode" ]]; then echo "This runner has no Xcode 26" >&2; exit 1; fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      # A fixed XcodeGen release with a known checksum. build.yml has the
      # same version.
      - name: Install XcodeGen
        env:
          XCODEGEN_VERSION: '2.46.0'
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL --proto '=https' -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Build the iOS app in Release for iPhones
        run: make ios-release
      - name: Verify and package the app
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          app=ios/build/Build/Products/Release-iphoneos/Flux.app
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Info.plist")
          if [[ "$version" != "$VERSION" ]]; then
            echo "::error::The iOS app has version $version, not $VERSION."
            exit 1
          fi
          mkdir -p release/Payload
          cp -R "$app" release/Payload/
          (cd release && zip -qry "flux-ios-$VERSION.ipa" Payload && rm -rf Payload)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-release
          path: release/
          if-no-files-found: error

  # Collects the release files, writes SHA256SUMS and the release notes, and
  # finds out whether the tag is the highest stable version.
  files:
    needs: [version, build, apk-sign, ipa]
    runs-on: ubuntu-latest
    outputs:
      sums: ${{ steps.files.outputs.sums }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      # The full history gives the commits since the previous tag for the release notes.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: refs/tags/${{ needs.version.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: arch-package
          path: artifacts/arch
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aur-package
          path: artifacts/aur
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release
          path: artifacts/android
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos-app
          path: artifacts/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-release
          path: artifacts/ios
      - name: Prepare release files
        id: files
        env:
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          mkdir release
          find artifacts/arch -name '*.pkg.tar.zst' -exec cp {} release/ \;
          cp artifacts/android/* release/
          cp artifacts/macos/flux-macos.zip "release/flux-macos-$VERSION.zip"
          cp "artifacts/ios/flux-ios-$VERSION.ipa" release/
          tar -czf "release/omarchy-flux-$VERSION-aur.tar.gz" -C artifacts/aur PKGBUILD .SRCINFO omarchy-flux.install
          (cd release && sha256sum -- *.pkg.tar.zst *.apk *.zip *.ipa *-aur.tar.gz android-certificate.txt > SHA256SUMS)
          echo "sums=$(base64 -w0 release/SHA256SUMS)" >> "$GITHUB_OUTPUT"
      # A patch tag on an earlier line, such as v0.6.1 after v0.7.0, does
      # not become the latest release, because fluxd and flux-cli update
      # read only the latest release. Only tags on master count. The
      # version job refuses other tags, so they have no release.
      - name: Find the highest stable tag
        id: latest
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          highest=$(git tag -l 'v*' --merged origin/master | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | sort -V | tail -n 1)
          if [[ "$TAG" == "$highest" ]]; then latest=true; else latest=false; fi
          echo "$TAG is the latest release: $latest"
          if [[ "$latest" == false ]]; then
            echo "::warning::$TAG is not the latest release, because $highest is higher. fluxd and flux-cli update do not offer $TAG."
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
      - name: Write release notes
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          range=${prev:+$prev..}$TAG
          {
            echo "## What's Changed"
            echo
            git log "$range" --format='%H%x09%an%x09%s' | while IFS=$'\t' read -r hash author title; do
              login=$(gh api "repos/$REPO/commits/$hash" --jq '.author.login // empty' 2>/dev/null || true)
              by=$author
              if [ -n "$login" ]; then by="$author ([@$login](https://github.com/$login))"; fi
              echo "- $title by $by ([\`${hash:0:7}\`](https://github.com/$REPO/commit/$hash))"
            done
            echo
            echo '## Checksums (SHA256)'
            echo
            echo '```'
            cat release/SHA256SUMS
            echo '```'
            if [ -n "$prev" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$REPO/compare/$prev...$TAG"
            fi
          } > release-notes.md
          cat release-notes.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            release/
            release-notes.md
          if-no-files-found: error

  # Signs SHA256SUMS with the Ed25519 release key. flux-cli and fluxd check
  # the signature with the public key in internal/release. Without the
  # secret, the release has no SHA256SUMS.sig. After the public key is set,
  # the job fails without the secret or with a secret of another key.
  sign:
    needs: [version, files]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    outputs:
      signature: ${{ steps.sign.outputs.signature }}
    steps:
      # The signing program comes from the workflow commit, because the tag
      # of an earlier release can lack it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Sign SHA256SUMS
        id: sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          SUMS: ${{ needs.files.outputs.sums }}
        run: |
          key=$(go run ./scripts/signsums key) || exit 1
          if [[ -z "$RELEASE_SIGNING_KEY" ]]; then
            if [[ -n "$key" ]]; then
              echo "::error::RELEASE_SIGNING_KEY is not set, and internal/release has the public key $key. flux-cli and fluxd refuse a release without SHA256SUMS.sig. See docs/releasing.md."
              exit 1
            fi
            echo '::warning::RELEASE_SIGNING_KEY is not set, so the release has no SHA256SUMS.sig. See docs/releasing.md.'
            exit 0
          fi
          printf '%s' "$SUMS" | base64 --decode > "$RUNNER_TEMP/SHA256SUMS"
          # sign fails when the secret does not match the public key.
          go run ./scripts/signsums sign "$RUNNER_TEMP/SHA256SUMS"
          echo "signature=$(cat "$RUNNER_TEMP/SHA256SUMS.sig")" >> "$GITHUB_OUTPUT"

  publish:
    needs: [version, files, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # This job has no checkout, so the write token is never in a
      # .git/config file.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: .
      - name: Add the signature
        env:
          SUMS: ${{ needs.files.outputs.sums }}
          SIGNATURE: ${{ needs.sign.outputs.signature }}
        run: |
          if [[ "$(base64 -w0 release/SHA256SUMS)" != "$SUMS" ]]; then
            echo '::error::SHA256SUMS differs from the file that the sign job signed.'
            exit 1
          fi
          if [[ -n "$SIGNATURE" ]]; then
            printf '%s\n' "$SIGNATURE" > release/SHA256SUMS.sig
          fi
      # A rebuild makes the release a draft while it replaces the files, so
      # that no update reads a mix of earlier and new files.
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
          LATEST: ${{ needs.files.outputs.latest }}
        run: |
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" == false ]]; then
              gh release edit "$TAG" --draft=true
            fi
            gh release edit "$TAG" --notes-file release-notes.md
            if [[ ! -f release/SHA256SUMS.sig ]]; then
              gh release delete-asset "$TAG" SHA256SUMS.sig --yes 2>/dev/null || true
            fi
          else
            gh release create "$TAG" --verify-tag --draft --title "Flux $TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" release/* --clobber
          gh release edit "$TAG" --draft=false --latest="$LATEST"

  # AUR gets only the highest stable version. aur.yml also refuses a
  # downgrade.
  aur:
    needs: [version, files, publish]
    if: vars.AUR_PUBLISH == 'true' && needs.files.outputs.latest == 'true'
    uses: ./.github/workflows/aur.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
      AUR_USERNAME: ${{ secrets.AUR_USERNAME }}
      AUR_EMAIL: ${{ secrets.AUR_EMAIL }}
      AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
